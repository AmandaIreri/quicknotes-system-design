<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes · API Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <header>
    <p class="eyebrow">Day 7 · Project 2 · fetch()</p>
    <h1>QuickNotes</h1>
    <p>Load, create and delete notes against the JSONPlaceholder API.</p>
  </header>

  <main>
    <section class="card">
      <div class="controls">
        <button id="load-btn" type="button">Load notes</button>
      </div>
      <p id="status" role="status">Press "Load notes" to fetch the ten most recent notes.</p>
    </section>

    <section class="card">
      <h2>New note</h2>
      <!-- novalidate: we validate in JS so the message appears in #status -->
      <form id="note-form" novalidate>
        <div class="field">
          <label for="title-input">Title <span class="hint">(required, max 100 characters)</span></label>
          <input id="title-input" name="title" type="text" maxlength="100"
                 placeholder="e.g. Grocery list" autocomplete="off">
        </div>

        <div class="field">
          <label for="body-input">Body <span class="hint">(optional)</span></label>
          <textarea id="body-input" name="body" rows="4"
                    placeholder="Anything else you want to remember..."></textarea>
        </div>

        <button id="submit-btn" type="submit">Save note</button>
      </form>
    </section>

    <section class="card">
      <h2>Notes</h2>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>Practice API: jsonplaceholder.typicode.com — the server does not really store what you create.</p>
  </footer>
</body>
</html>
